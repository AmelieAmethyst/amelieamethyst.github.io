<!DOCTYPE html>
<html>
<head>
<title>Iron Halo DJ Board</title>

<style>
body{
    margin:0;
    background:#050505;
    color:#b266ff;
    font-family:Arial, sans-serif;
    text-align:center;
}

.container{
    padding-top:40px;
}

.logo{
    font-size:48px;
    font-weight:bold;
    color:#d8b4ff;
    text-shadow:0 0 20px #8a2be2;
}

.section{
    margin-top:30px;
}

.label{
    font-size:22px;
    color:#888;
}

.value{
    font-size:36px;
    color:white;
    text-shadow:0 0 15px #8a2be2;
}

.status{
    color:#00ff99;
}

.footer{
    margin-top:40px;
    color:#666;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
🔥 THE IRON HALO 🔥
</div>

<div class="section">
<div class="label">CURRENT DJ</div>
<div class="value">Offline</div>
</div>

<div class="section">
<div class="label">STATUS</div>
<div class="value status">Ready</div>
</div>

<div class="footer">
Iron Halo DJ Board
</div>

</div>

</body>
</html>
