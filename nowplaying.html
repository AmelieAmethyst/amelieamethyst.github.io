<!DOCTYPE html>
<html>
<head>
<title>Iron Halo Now Playing</title>
<style>
body{
    margin:0;
    background:#050008;
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}
.wrap{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:40px;
    background:radial-gradient(circle, #2b0050, #050008 70%);
}
.photo{
    width:38%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:25px;
    box-shadow:0 0 35px #a855f7;
    border:4px solid #b266ff;
}
.info{
    width:50%;
    text-align:center;
}
.logo{
    font-size:46px;
    color:#d8b4ff;
    text-shadow:0 0 20px #8a2be2;
    font-weight:bold;
}
.label{
    margin-top:25px;
    font-size:22px;
    color:#aaa;
    letter-spacing:3px;
}
.value{
    font-size:42px;
    color:white;
    text-shadow:0 0 20px #b266ff;
}
.status{
    color:#00ff99;
}
</style>
</head>

<body>
<div class="wrap">
    <img class="photo" id="photo" src="">
    <div class="info">
        <div class="logo">🔥 THE IRON HALO 🔥</div>

        <div class="label">NOW PLAYING</div>
        <div class="value" id="name">TIPJAR INACTIVE</div>

        <div class="label">STATUS</div>
        <div class="value status" id="status">Waiting for DJ</div>

        <div class="label">MODE</div>
        <div class="value" id="mode">Inactive</div>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("name").textContent = params.get("name") || "TIPJAR INACTIVE";
document.getElementById("status").textContent = params.get("status") || "Waiting for DJ";
document.getElementById("mode").textContent = params.get("mode") || "Inactive";

const photo = params.get("photo");
if(photo){
    document.getElementById("photo").src = photo;
}
</script>
</body>
</html>
